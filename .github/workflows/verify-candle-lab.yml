name: Verify public Candle Lab URL

on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-candle-lab.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify public HTTPS response and exact application bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, hashlib, json, time
          urls = [
            'https://rawcdn.githack.com/lovelycong89-ship-it/jj/0dbc93500bd97e97b01287010326f7ec29c03597/candle-lab/index.html',
            'https://raw.githack.com/lovelycong89-ship-it/jj/main/candle-lab/index.html',
          ]
          expected = '6c4fe919f7854acdaaba03314a06aaabc3808bc37028525a464ba9e85ee6b294'
          results = []
          for url in urls:
            for attempt in range(3):
              try:
                req = urllib.request.Request(url, headers={'User-Agent':'CandleLab-public-deployment-check/1.0'})
                with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read()
                  result = {'url':url,'status':r.status,'content_type':r.headers.get('Content-Type'),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
                assert result['status'] == 200, result
                assert 'text/html' in result['content_type'], result
                assert result['sha256'] == expected, result
                print(json.dumps(result, ensure_ascii=False), flush=True)
                results.append(result)
                break
              except Exception as e:
                print('Check attempt',attempt+1,repr(e),flush=True)
                if attempt == 2:
                  raise
                time.sleep(8)
          print('PUBLIC_DEPLOYMENT_VERIFIED',len(results),'HTTPS URLs deliver the original app unchanged.',flush=True)
          PY
